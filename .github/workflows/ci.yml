name: Production-Level CI/CD

on: push

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: 
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest
                python: 
                    - "3.10"
                    - "3.11"
                    - "3.12"
            
        runs-on: ${{matrix.os}}
        