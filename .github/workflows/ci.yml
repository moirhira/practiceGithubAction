name: Artifact

on: push

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: create the file
        run : echo "Current date:" > file.txt
      
      - name: save the current date
        run : echo $(date) >> file.txt

      - name: upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ./file.txt

  job-2:
    needs: job-1
    runs-on: ubuntu-latest
    steps:
      - name: download the artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact
          path: download
      
      - name: read the artifact content
        run : cat download/file.txt