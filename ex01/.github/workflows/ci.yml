name: Hello Github Action

on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: print hello
              run : echo Hello Github Actions

            - name: print date
              run : echo "Current date is $(date + '%Y-%m-%d')"

            - name: print the repo and the branch name
              run : |
                    echo "Repository Name is: ${{ github.event.repository.name }}"
                    echo "Branch Name is: ${GITHUB_REF#refs/heads/}"


